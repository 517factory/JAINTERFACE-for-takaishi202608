<html lang="ja">

    <meta charset="UTF-8" />

    <link rel="stylesheet" type="text/css" href="style.css" />

  <body>
    <h1>Cocobox Control Panel</h1>
    <div class="status">
      <table>
        <!-- <thead>
          <tr>
            <th>項目</th>
            <th>値</th>
          </tr>
        </thead> -->
        <tbody>
          <tr>
            <td>FWVersion</td>
            <td><span id="FWVersion" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>timecode</td>
            <td><span id="timecode" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Key Storage Unit</td>
            <td><span id="isKSUexist" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Key status</td>
            <td><span id="isKeyLocked" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Door status</td>
            <td><span id="isDoorClosed" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Power Source</td>
            <td><span id="isACPower" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Temperature</td>
            <td><span id="temperature" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Humidity</td>
            <td><span id="humidity" class="loading">Loading...</span></td>
          </tr>
          <tr>
            <td>Battery Voltage</td>
            <td><span id="batteryVoltage" class="loading">Loading...</span></td>
          </tr>
        </tbody>
      </table>
      <div id="errorMessage" class="error"></div>
      <div id="commandMessage" class="message"></div>
    </div>
    <div class="controls">
      <button id="reloadButton">Reload</button>
      <button id="lockButton">Lock</button>
      <button id="unlockButton">Unlock</button>
    </div>

    <div class="footer">
      <a href="/">Go To Top</a>
    </div>

    <script>
      async function fetchStatus() {
        const statusElements = document.querySelectorAll(".status span");
        statusElements.forEach((element) => {
          element.textContent = "Loading...";
          element.classList.add("loading");
        });
        document.getElementById("errorMessage").textContent = "";

        try {
          const response = await fetch("/status.json");
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          console.log("Response data:", data);

          if (data) {
            // データ存在チェックを追加
            document.getElementById("FWVersion").textContent =
              data.FWVersion || "N/A";
            document.getElementById("timecode").textContent =
              data.timecode || "N/A";
            document.getElementById("isKSUexist").textContent =
              data.isKSUexist !== undefined
                ? data.isKSUexist
                  ? "INSTALLED"
                  : "NOT INSTALLED"
                : "N/A";
            document.getElementById("isKeyLocked").textContent =
              data.isKeyLocked !== undefined
                ? data.isKeyLocked
                  ? "LOCK"
                  : "UNLOCK"
                : "N/A";
            document.getElementById("isDoorClosed").textContent =
              data.isDoorClosed !== undefined
                ? data.isDoorClosed
                  ? "CLOSE"
                  : "OPEN"
                : "N/A";
            document.getElementById("isACPower").textContent =
              data.isACPower !== undefined
                ? data.isACPower
                  ? "AC"
                  : "BT"
                : "N/A";
            document.getElementById("temperature").textContent =
              data.temperature !== undefined ? `${data.temperature} °C` : "N/A";
            document.getElementById("humidity").textContent =
              data.humidity !== undefined ? `${data.humidity} %` : "N/A";
            document.getElementById("batteryVoltage").textContent =
              data.BatteryVolt !== undefined
                ? `${data.BatteryVolt.toFixed(2)} V`
                : "N/A";

            statusElements.forEach((element) =>
              element.classList.remove("loading")
            );
          } else {
            throw new Error("Invalid data received from server.");
          }
        } catch (error) {
          console.error("Failed to fetch status:", error);
          let errorMessage = "Failed to load data.";
          if (error.message.includes("HTTP error")) {
            errorMessage += ` Server returned error code: ${
              error.message.split("status: ")[1]
            }`;
          } else if (error.message.includes("Failed to fetch")) {
            errorMessage += " Please check your network connection.";
          } else {
            errorMessage += " Please check the server.";
          }
          document.getElementById("errorMessage").textContent = errorMessage;
          statusElements.forEach((element) => {
            element.textContent = "Error";
            element.classList.remove("loading");
          });
        }
      }

      async function sendCommand(command) {
        const messageElement = document.getElementById("commandMessage");
        messageElement.textContent = `${command.toUpperCase()}ING...`;
        messageElement.classList.remove("error", "success");

        try {
          const response = await fetch(`/${command}`, { method: "POST" });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          if (data && data.message) {
            messageElement.textContent = data.message;
          } else {
            messageElement.textContent = `${command.toUpperCase()}ED`;
          }
          messageElement.classList.add("success");
          fetchStatus(); // コマンド送信後にステータスを更新
        } catch (error) {
          console.error(`Failed to ${command}:`, error);
          messageElement.textContent = `Failed to ${command} operation.`;
          messageElement.classList.add("error");
        }
      }

      document.addEventListener("DOMContentLoaded", fetchStatus);
      document
        .getElementById("reloadButton")
        .addEventListener("click", fetchStatus);
      document
        .getElementById("lockButton")
        .addEventListener("click", () => sendCommand("lock"));
      document
        .getElementById("unlockButton")
        .addEventListener("click", () => sendCommand("unlock"));
    </script>
